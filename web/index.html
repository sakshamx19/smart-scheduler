<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Agent</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b4be0'/%3E%3Cpath d='M16 7a4 4 0 0 0-4 4v5a4 4 0 0 0 8 0v-5a4 4 0 0 0-4-4zM9.5 15.5a6.5 6.5 0 0 0 13 0M16 22v3' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <span class="mark" aria-hidden="true"></span>
        <div class="who">
          <h1 class="name">Agent</h1>
          <p class="about"></p>
        </div>
        <button class="btn quiet" id="new-chat" type="button">New chat</button>
      </header>

      <main class="scroll" id="scroll">
        <div class="column" id="log" aria-live="polite"></div>
      </main>

      <footer class="dock">
        <div class="caption" id="caption" role="status" aria-live="polite"></div>
        <form class="composer" id="composer" autocomplete="off">
          <label class="sr-only" for="input">Message</label>
          <textarea id="input" rows="1" placeholder="Message…"></textarea>
          <button class="orb" id="talk" type="button" hidden aria-pressed="false" aria-label="Start a voice conversation">
            <span class="ring" aria-hidden="true"></span>
            <svg class="icon mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
            <svg class="icon stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" /></svg>
          </button>
          <button class="send" id="send" type="submit" aria-label="Send">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
          </button>
        </form>
        <p class="fineprint" id="fineprint" aria-live="polite">Enter to send · Shift+Enter for a new line</p>
      </footer>
    </div>

    <dialog class="gate" id="gate">
      <form method="dialog" id="gate-form">
        <h2>Access code</h2>
        <p>This agent is private. Enter the code you were given.</p>
        <label class="sr-only" for="gate-code">Access code</label>
        <input id="gate-code" type="password" autocomplete="current-password" required />
        <p class="gate-error" id="gate-error" role="alert"></p>
        <button class="btn primary" type="submit">Continue</button>
      </form>
    </dialog>
  </body>
</html>
